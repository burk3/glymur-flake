[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "a16-observer"
dynamic = ["version"]
description = "A16 observability: serial daemon, sinks, A16-side telemetry, and the a16 CLI (docs/observability-plan.md)"
requires-python = ">=3.11"

[project.scripts]
a16 = "a16_observer.cli:main"
a16-obs = "a16_observer.daemons:main"
a16-telemetry = "a16_observer.telemetry:main"
a16-snap = "a16_observer.snap.main:main"

[tool.setuptools]
packages = ["a16_observer", "a16_observer.snap", "a16_observer.snap.collectors"]

[tool.setuptools.dynamic]
version = { attr = "a16_observer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
